# Provider registry. "enabled: auto" => enabled iff the api_key_env variable
# is set and non-empty. Base URLs are stable but marked VERIFY anyway; Claude
# Code confirms each with one live smoke call (see HANDOFF_TO_CLAUDE_CODE.md).

providers:
  groq:
    base_url: https://api.groq.com/openai/v1   # VERIFY
    api_key_env: GROQ_API_KEY
    enabled: auto
    role: candidate

  openrouter:
    base_url: https://openrouter.ai/api/v1     # VERIFY
    api_key_env: OPENROUTER_API_KEY
    enabled: auto
    role: candidate

  mistral:
    base_url: https://api.mistral.ai/v1        # VERIFY
    api_key_env: MISTRAL_API_KEY
    enabled: auto
    role: candidate

  openai:
    base_url: https://api.openai.com/v1        # VERIFY
    api_key_env: OPENAI_API_KEY
    enabled: auto      # models on it are individually disabled by default
    role: candidate

  gemini:
    base_url: https://generativelanguage.googleapis.com/v1beta   # VERIFY
    api_key_env: GEMINI_API_KEY
    enabled: auto
    role: judge
